name: amwal_islamic
description: Islamic Wealth Management Application - Aplikasi Manajemen Keuangan Islami
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Material Design 3
  material_symbols_icons: ^4.2785.1

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Local Database
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Routing
  go_router: ^14.2.0

  # API & Network
  dio: ^5.4.3+1
  http: ^1.2.1

  # Utilities
  intl: ^0.19.0
  shared_preferences: ^2.2.3
  path_provider: ^2.1.3
  uuid: ^4.4.0

  # UI Components
  fl_chart: ^0.68.0
  shimmer: ^3.0.0
  flutter_slidable: ^3.1.0

  # Date & Time
  hijri: ^3.0.0
  timezone: ^0.9.3

  # Functional Programming
  dartz: ^0.10.1

  # JSON Serialization
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0

  # Formatting
  currency_formatter: ^2.2.1

  # Icons
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

  # Code Generation
  build_runner: ^2.4.9
  hive_generator: ^2.0.1
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.0

  # Testing
  mockito: ^5.4.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700
